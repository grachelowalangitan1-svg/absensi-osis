<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Absensi OSIS - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0c4e6e 0%, #1e7898 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Card login */
        .login-card {
            background: white;
            border-radius: 32px;
            width: 100%;
            max-width: 420px;
            padding: 32px 28px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .login-card h2 {
            font-size: 28px;
            color: #0c4e6e;
            margin-bottom: 8px;
            text-align: center;
        }

        .login-card .subtitle {
            text-align: center;
            color: #5a6874;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1e2a3a;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 28px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            background: #f8fafc;
        }

        .input-wrapper input:focus {
            border-color: #1e7898;
            background: white;
            box-shadow: 0 0 0 3px rgba(30,120,152,0.2);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #5a6874;
            padding: 0;
            margin: 0;
            width: auto;
        }

        button {
            width: 100%;
            background: #0c4e6e;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: #1e7898;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 40px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .message.error {
            background: #fee2e2;
            color: #b91c1c;
            display: block;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
            display: block;
        }

        /* Dashboard */
        .dashboard-container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h3 {
            color: #0c4e6e;
            margin-bottom: 16px;
        }

        .user-greeting {
            background: #e6f7ff;
            padding: 14px 20px;
            border-radius: 28px;
            margin-bottom: 24px;
            text-align: center;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 28px;
            font-size: 15px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0 10px;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #1e293b;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            border: 1px solid #cbd5e1;
            padding: 10px 8px;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .status-hadir { color: #15803d; font-weight: bold; }
        .status-alpha { color: #b91c1c; }
        .status-izin { color: #d97706; }
        .status-sakit { color: #2563eb; }
        .belum-absen { color: #6c757d; font-style: italic; }

        @media (max-width: 640px) {
            .login-card { padding: 24px 20px; }
            th, td { font-size: 12px; }
        }
    </style>
</head>
<body>

<!-- Halaman Login -->
<div id="loginPage" class="login-card">
    <h2>📋 Absensi OSIS</h2>
    <div class="subtitle">Masukkan username dan password Anda</div>

    <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="contoh: admin" autocomplete="off">
    </div>

    <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
            <input type="password" id="password" placeholder="********">
            <button type="button" class="toggle-password" id="togglePassword">👁️</button>
        </div>
    </div>

    <button id="loginButton">🔐 Login</button>
    <div id="loginMessage" class="message"></div>
</div>

<!-- Dashboard (awalnya tersembunyi) -->
<div id="dashboardPage" style="display: none;" class="dashboard-container">
    <div class="card">
        <div class="user-greeting" id="userGreeting"></div>
        <div class="form-group">
            <label>Status Kehadiran</label>
            <select id="statusAbsen">
                <option value="Hadir">✅ Hadir</option>
                <option value="Izin">📝 Izin</option>
                <option value="Sakit">🤒 Sakit</option>
                <option value="Alpha">❌ Alpha</option>
            </select>
        </div>
        <button id="absenButton">📌 Kirim Absensi</button>
        <button id="logoutButton" class="btn-secondary" style="margin-top: 12px;">🚪 Logout</button>
        <div id="absenMessage" class="message" style="margin-top: 16px;"></div>
    </div>

    <!-- Panel Admin (hanya untuk jabatan Admin) -->
    <div id="adminPanel" style="display: none;">
        <div class="card">
            <h3>📊 Panel Admin – Rekap Kehadiran Hari Ini</h3>
            <div class="btn-group">
                <button id="refreshAdminBtn">🔄 Refresh</button>
                <button id="printPDFBtn">📄 Cetak PDF</button>
                <button id="downloadTXTBtn">📁 Download TXT</button>
            </div>
            <div class="table-wrapper">
                <table id="adminTable">
                    <thead>
                        <tr><th>No</th><th>Nama Lengkap</th><th>Jabatan</th><th>Status Hari Ini</th><th>Waktu Absen</th></tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <tr><td colspan="5">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // ==================== KONFIGURASI ====================
    const API_URL = 'https://script.google.com/macros/s/AKfycbyaYDvnbMz9FUSXs53O-zT4gldbCFYR3S_vB8JOcuPD5k41yYELMkMEmGy4s9WcQdpcqg/exec';
    
    // State global
    let currentUser = null;

    // DOM Elements
    const loginPage = document.getElementById('loginPage');
    const dashboardPage = document.getElementById('dashboardPage');
    const loginBtn = document.getElementById('loginButton');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginMessageDiv = document.getElementById('loginMessage');
    const absenMessageDiv = document.getElementById('absenMessage');
    const userGreeting = document.getElementById('userGreeting');
    const statusSelect = document.getElementById('statusAbsen');
    const absenBtn = document.getElementById('absenButton');
    const logoutBtn = document.getElementById('logoutButton');
    const adminPanel = document.getElementById('adminPanel');
    const adminTableBody = document.getElementById('adminTableBody');
    const refreshAdminBtn = document.getElementById('refreshAdminBtn');
    const printPDFBtn = document.getElementById('printPDFBtn');
    const downloadTXTBtn = document.getElementById('downloadTXTBtn');

    // Helper: tampilkan pesan
    function showMessage(element, message, type = 'error') {
        element.textContent = message;
        element.className = `message ${type}`;
        setTimeout(() => {
            element.className = 'message';
            element.textContent = '';
        }, 4000);
    }

    // Helper: panggil API (POST)
    async function callAPI(action, payload = {}) {
        const body = { action, ...payload };
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const result = await response.json();
            console.log(`[API ${action}]`, result);
            return result;
        } catch (err) {
            console.error(`Error callAPI (${action}):`, err);
            return { success: false, message: 'Gagal terhubung ke server. Periksa koneksi atau CORS.' };
        }
    }

    // Proses login
    async function handleLogin() {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
            showMessage(loginMessageDiv, 'Username dan password harus diisi', 'error');
            return;
        }

        // Nonaktifkan tombol sementara
        loginBtn.disabled = true;
        loginBtn.textContent = 'Memproses...';

        const result = await callAPI('login', { username, password });

        loginBtn.disabled = false;
        loginBtn.textContent = '🔐 Login';

        if (result && result.success) {
            currentUser = {
                username: result.username,
                namaLengkap: result.namaLengkap,
                jabatan: result.jabatan
            };
            // Simpan ke localStorage (opsional)
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            
            // Tampilkan dashboard
            loginPage.style.display = 'none';
            dashboardPage.style.display = 'block';
            
            userGreeting.innerHTML = `<strong>👋 Selamat datang, ${currentUser.namaLengkap}</strong><br>Jabatan: ${currentUser.jabatan}`;
            
            // Jika Admin, tampilkan panel admin dan muat data
            if (currentUser.jabatan === 'Admin') {
                adminPanel.style.display = 'block';
                loadAdminData();
            } else {
                adminPanel.style.display = 'none';
            }
            
            // Reset field login
            usernameInput.value = '';
            passwordInput.value = '';
            loginMessageDiv.className = 'message';
        } else {
            const errorMsg = (result && result.message) ? result.message : 'Login gagal, periksa username/password';
            showMessage(loginMessageDiv, errorMsg, 'error');
        }
    }

    // Fungsi absen
    async function handleAbsen() {
        if (!currentUser) return;
        const status = statusSelect.value;
        const result = await callAPI('absen', {
            username: currentUser.username,
            namaLengkap: currentUser.namaLengkap,
            jabatan: currentUser.jabatan,
            status: status
        });
        if (result && result.success) {
            showMessage(absenMessageDiv, `✅ ${result.message} (${status})`, 'success');
            if (currentUser.jabatan === 'Admin') loadAdminData(); // refresh tabel admin
        } else {
            showMessage(absenMessageDiv, result?.message || 'Gagal absen', 'error');
        }
    }

    // Logout
    function handleLogout() {
        currentUser = null;
        localStorage.removeItem('currentUser');
        loginPage.style.display = 'block';
        dashboardPage.style.display = 'none';
        adminPanel.style.display = 'none';
        // Reset form
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        window.scrollTo(0, 0);
    }

    // Load data untuk admin (semua user + absensi hari ini)
    async function loadAdminData() {
        adminTableBody.innerHTML = '<tr><td colspan="5">Memuat data...</td></tr>';
        
        const usersRes = await callAPI('getAllUsers');
        if (!usersRes.success) {
            adminTableBody.innerHTML = `<tr><td colspan="5">Gagal memuat data pengguna: ${usersRes.message}</td></tr>`;
            return;
        }
        const allUsers = usersRes.users;
        
        const rekapRes = await callAPI('getRekapByDate', { tanggal: new Date().toISOString() });
        const absensiHariIni = rekapRes.success ? rekapRes.absensi : [];
        
        const absenMap = {};
        absensiHariIni.forEach(a => {
            absenMap[a.username] = { status: a.status, timestamp: new Date(a.timestamp).toLocaleTimeString('id-ID') };
        });
        
        let html = '';
        allUsers.forEach((user, idx) => {
            const absenInfo = absenMap[user.username];
            const status = absenInfo ? absenInfo.status : 'Belum absen';
            const waktu = absenInfo ? absenInfo.timestamp : '-';
            let statusClass = '';
            if (status === 'Hadir') statusClass = 'status-hadir';
            else if (status === 'Alpha') statusClass = 'status-alpha';
            else if (status === 'Izin') statusClass = 'status-izin';
            else if (status === 'Sakit') statusClass = 'status-sakit';
            else statusClass = 'belum-absen';
            
            html += `<tr>
                        <td>${idx+1}</td>
                        <td>${escapeHtml(user.namaLengkap)}</td>
                        <td>${escapeHtml(user.jabatan)}</td>
                        <td class="${statusClass}">${status}</td>
                        <td>${waktu}</td>
                     </tr>`;
        });
        adminTableBody.innerHTML = html;
    }
    
    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    
    // Cetak PDF (menggunakan jendela print)
    function printAsPDF() {
        const table = document.getElementById('adminTable').cloneNode(true);
        const title = `Laporan Absensi OSIS - ${new Date().toLocaleDateString('id-ID')}`;
        const win = window.open('', '_blank');
        win.document.write(`
            <html><head><title>Laporan Absensi</title>
            <style>
                body { font-family: Arial, sans-serif; padding: 20px; }
                table { border-collapse: collapse; width: 100%; }
                th, td { border: 1px solid #000; padding: 8px; text-align: left; }
                th { background: #f2f2f2; }
                h3 { text-align: center; }
            </style>
            </head><body>
            <h3>${title}</h3>
            ${table.outerHTML}
            </body></html>
        `);
        win.document.close();
        win.print();
    }
    
    function downloadAsTXT() {
        const rows = adminTableBody.querySelectorAll('tr');
        let txt = `LAPORAN ABSENSI OSIS - ${new Date().toLocaleDateString('id-ID')}\n`;
        txt += `================================================================\n`;
        txt += `No\tNama Lengkap\tJabatan\tStatus Hari Ini\tWaktu Absen\n`;
        rows.forEach(row => {
            const cols = row.querySelectorAll('td');
            if (cols.length === 5) {
                txt += `${cols[0].innerText}\t${cols[1].innerText}\t${cols[2].innerText}\t${cols[3].innerText}\t${cols[4].innerText}\n`;
            }
        });
        const blob = new Blob([txt], { type: 'text/plain' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `rekap_absensi_${new Date().toISOString().slice(0,10)}.txt`;
        link.click();
        URL.revokeObjectURL(link.href);
    }
    
    // Toggle password visibility
    const togglePassword = document.getElementById('togglePassword');
    togglePassword.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
    });
    
    // Event listeners
    loginBtn.addEventListener('click', handleLogin);
    absenBtn.addEventListener('click', handleAbsen);
    logoutBtn.addEventListener('click', handleLogout);
    if (refreshAdminBtn) refreshAdminBtn.addEventListener('click', loadAdminData);
    if (printPDFBtn) printPDFBtn.addEventListener('click', printAsPDF);
    if (downloadTXTBtn) downloadTXTBtn.addEventListener('click', downloadAsTXT);
    
    // Cek auto login dari localStorage (opsional)
    const savedUser = localStorage.getItem('currentUser');
    if (savedUser) {
        try {
            const parsed = JSON.parse(savedUser);
            if (parsed && parsed.username) {
                currentUser = parsed;
                loginPage.style.display = 'none';
                dashboardPage.style.display = 'block';
                userGreeting.innerHTML = `<strong>👋 Selamat datang, ${currentUser.namaLengkap}</strong><br>Jabatan: ${currentUser.jabatan}`;
                if (currentUser.jabatan === 'Admin') {
                    adminPanel.style.display = 'block';
                    loadAdminData();
                }
            }
        } catch(e) { localStorage.removeItem('currentUser'); }
    }
    
    // Tombol enter pada password
    passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
    usernameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') passwordInput.focus(); });
</script>
</body>
</html>
